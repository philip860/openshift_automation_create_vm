apiVersion: v1
kind: Service
metadata:
  name: VM_NAME-ssh
  namespace: virtual-machines
spec:
  type: NodePort
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
      nodePort: NODE_PORT
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: VM_NAME-ssh-1
  namespace: virtual-machines
  labels:
    kubernetes.io/service-name: VM_NAME-ssh
addressType: IPv4
ports:
  - name: ssh
    protocol: TCP
    port: 22
endpoints:
  - addresses:
      - VM_POD_IP