---
# 1) PREFLIGHT

- name: Preflight | Verify API server reachable with optional DNS fallback
  block:
    - name: Preflight | Verify API server reachable using kubeconfig DNS
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: default
        wait: false
        wait_timeout: "{{ ocp_api_k8s_wait_timeout | int }}"
      register: api_check

  rescue:
    - name: Preflight | Fail if ocp_api_ip is not defined
      ansible.builtin.fail:
        msg: >
          Unable to reach the OpenShift API using the DNS name from kubeconfig.
          Define ocp_api_ip, for example ocp_api_ip: 10.0.0.50.
      when: ocp_api_ip is not defined or ocp_api_ip | length == 0

    - name: Preflight | Add temporary OpenShift API DNS override inside AAP EE
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^\s*[0-9a-fA-F:.]+\s+{{ ocp_api_dns_name | regex_escape }}(\s|$)'
        line: "{{ ocp_api_ip }} {{ ocp_api_dns_name }}"
        state: present
        backup: false

    - name: Preflight | Verify /etc/hosts resolution
      ansible.builtin.command:
        cmd: "getent hosts {{ ocp_api_dns_name }}"
      register: ocp_hosts_check
      changed_when: false
      failed_when: false

    - name: Preflight | Show resolved OpenShift API host
      ansible.builtin.debug:
        msg:
          - "Expected API DNS: {{ ocp_api_dns_name }}"
          - "Expected API IP: {{ ocp_api_ip }}"
          - "Resolved result: {{ ocp_hosts_check.stdout | default('NO RESOLUTION FOUND') }}"

    - name: Preflight | Test TCP connection to OpenShift API
      ansible.builtin.wait_for:
        host: "{{ ocp_api_dns_name }}"
        port: 6443
        timeout: "{{ ocp_api_tcp_timeout | int }}"
        connect_timeout: 5
        state: started
      register: ocp_api_tcp_check
      failed_when: false

    - name: Preflight | Fail clearly if OpenShift API TCP port is unreachable
      ansible.builtin.fail:
        msg: >
          The DNS fallback was added, but AAP still cannot reach
          {{ ocp_api_dns_name }}:6443 using IP {{ ocp_api_ip }}.

          This is now a network/routing/firewall/API issue, not a kubeconfig issue.

          Check from the AAP host or EE container:
          curl -k https://{{ ocp_api_dns_name }}:6443/version

          Also verify:
          - ocp_api_ip is correct
          - OpenShift API is online
          - port 6443 is reachable from AAP
          - firewall allows AAP to reach {{ ocp_api_ip }}:6443
      when: ocp_api_tcp_check.elapsed is defined and ocp_api_tcp_check.elapsed >= (ocp_api_tcp_timeout | int)

    - name: Preflight | Test OpenShift API /version endpoint
      ansible.builtin.command:
        cmd: "curl -k --connect-timeout {{ ocp_api_curl_timeout | int }} https://{{ ocp_api_dns_name }}:6443/version"
      register: api_curl_test
      changed_when: false
      failed_when: api_curl_test.rc != 0

    - name: Preflight | Show OpenShift API /version response
      ansible.builtin.debug:
        var: api_curl_test.stdout

    - name: Preflight | Retry API server reachable after /etc/hosts override
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: default
        wait: false
        wait_timeout: "{{ ocp_api_k8s_wait_timeout | int }}"
      register: api_check

- name: Preflight | Verify KubeVirt VirtualMachine CRD exists
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: virtualmachines.kubevirt.io
    wait: false
    wait_timeout: "{{ ocp_api_k8s_wait_timeout | int }}"
  register: crd_vm

- name: Preflight | Verify CDI DataVolume CRD exists
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: datavolumes.cdi.kubevirt.io
    wait: false
    wait_timeout: "{{ ocp_api_k8s_wait_timeout | int }}"
  register: crd_dv

- name: Preflight | Fail if required CRDs missing
  ansible.builtin.assert:
    that:
      - crd_vm.resources | length > 0
      - crd_dv.resources | length > 0
    fail_msg: >
      Required CRDs missing. Install OpenShift Virtualization (KubeVirt) and CDI.

- name: Preflight | If StorageClass set, ensure it exists
  when: storage_class | length > 0
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ storage_class }}"
    wait: false
    wait_timeout: "{{ ocp_api_k8s_wait_timeout | int }}"
  register: sc_info

- name: Preflight | Fail if specified StorageClass not found
  when: storage_class | length > 0
  ansible.builtin.assert:
    that:
      - sc_info.resources | length > 0
    fail_msg: "StorageClass '{{ storage_class }}' not found."

- name: Preflight | Validate image_url basic format
  ansible.builtin.assert:
    that:
      - image_url is match('^https?://.+')
    fail_msg: "image_url must be HTTP/HTTPS."

- name: Preflight | HEAD check the image_url to avoid CDI retry loops
  when: not ansible_check_mode
  ansible.builtin.uri:
    url: "{{ image_url }}"
    method: HEAD
    return_content: false
    validate_certs: true
    timeout: 30
  register: image_head
  failed_when: image_head.status not in [200]

# 2) PLAN

- name: Plan | Show intended objects
  when: ansible_check_mode
  ansible.builtin.debug:
    msg:
      - "Would ensure Namespace '{{ namespace }}' exists."
      - "Would create VM '{{ vm_name }}' with {{ cpu_cores | int }} vCPU, {{ memory }} RAM."
      - "Would create DataVolume '{{ vm_name }}-rootdisk' size {{ disk_size }}."
      - "Would import image from '{{ image_url }}'. RunStrategy='{{ run_strategy }}'."

# 3) BUILD DEFINITIONS

- name: Build | Base DataVolume storage definition
  ansible.builtin.set_fact:
    vm_dv_storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: "{{ disk_size }}"

- name: Build | Add optional DataVolume storageClassName
  when: storage_class | length > 0
  ansible.builtin.set_fact:
    vm_dv_storage: "{{ vm_dv_storage | combine({'storageClassName': storage_class}, recursive=True) }}"

- name: Build | Add optional DataVolume volumeMode
  when: volume_mode | length > 0
  ansible.builtin.set_fact:
    vm_dv_storage: "{{ vm_dv_storage | combine({'volumeMode': volume_mode}, recursive=True) }}"

- name: Build | Render cloud-init userData
  ansible.builtin.set_fact:
    vm_cloud_init_userdata: |
      #cloud-config
      user: cloud-user
      password: "{{ initial_password }}"
      chpasswd: { expire: False }
      ssh_pwauth: {{ ssh_password_auth | bool | lower }}
      {% if ssh_public_key | length > 0 %}
      ssh_authorized_keys:
        - "{{ ssh_public_key }}"
      {% endif %}
      package_update: true
      runcmd:
        - [ sh, -c, "dnf -y install qemu-guest-agent && systemctl enable --now qemu-guest-agent || true" ]

- name: Build | Render VirtualMachine definition
  ansible.builtin.set_fact:
    vm_definition:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      metadata:
        name: "{{ vm_name }}"
        namespace: "{{ namespace }}"
        labels:
          app: "{{ vm_name }}"
      spec:
        runStrategy: "{{ run_strategy }}"
        dataVolumeTemplates:
          - metadata:
              name: "{{ vm_name }}-rootdisk"
            spec:
              source:
                http:
                  url: "{{ image_url }}"
              storage: "{{ vm_dv_storage }}"
        template:
          metadata:
            labels:
              kubevirt.io/domain: "{{ vm_name }}"
          spec:
            domain:
              cpu:
                cores: "{{ cpu_cores | int }}"
              resources:
                requests:
                  memory: "{{ memory }}"
              devices:
                disks:
                  - name: rootdisk
                    disk:
                      bus: virtio
                  - name: cloudinitdisk
                    disk:
                      bus: virtio
                interfaces:
                  - name: default
                    masquerade: {}
            networks:
              - name: default
                pod: {}
            volumes:
              - name: rootdisk
                dataVolume:
                  name: "{{ vm_name }}-rootdisk"
              - name: cloudinitdisk
                cloudInitNoCloud:
                  userData: "{{ vm_cloud_init_userdata }}"

- name: Build | Show rendered VM definition
  ansible.builtin.debug:
    var: vm_definition

# 4) CREATE/APPLY

- name: Create | Ensure target Namespace exists
  when: not ansible_check_mode
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Namespace
    name: "{{ namespace }}"
    state: present
    wait: true
    wait_timeout: "{{ ocp_api_k8s_wait_timeout | int }}"

- name: Create | Define/Apply VirtualMachine with DataVolumeTemplate
  when: not ansible_check_mode
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    namespace: "{{ namespace }}"
    state: present
    definition: "{{ vm_definition }}"
    wait: true
    wait_timeout: "{{ ocp_api_k8s_wait_timeout | int }}"

# 5) WAITS

- name: Wait | DataVolume import to complete
  when: not ansible_check_mode
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    name: "{{ vm_name }}-rootdisk"
    namespace: "{{ namespace }}"
    wait: false
    wait_timeout: "{{ ocp_api_k8s_wait_timeout | int }}"
  register: dv
  until: >
    (dv.resources | length) > 0 and
    (dv.resources[0].status is defined) and
    (
      (dv.resources[0].status.phase | default('')) == "Succeeded" or
      (dv.resources[0].status.phase | default('')) == "Failed"
    )
  retries: "{{ dv_wait_retries | int }}"
  delay: "{{ dv_wait_delay | int }}"

- name: Fail | Show CDI import error if DataVolume failed
  when:
    - not ansible_check_mode
    - dv.resources | length > 0
    - (dv.resources[0].status.phase | default('')) == "Failed"
  ansible.builtin.fail:
    msg: >
      DataVolume import failed. Phase={{ dv.resources[0].status.phase | default('') }}.
      Check importer pod logs and PVC events for details.

- name: Wait | VM to reach a runnable state
  when: not ansible_check_mode
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ vm_name }}"
    namespace: "{{ namespace }}"
    wait: false
    wait_timeout: "{{ ocp_api_k8s_wait_timeout | int }}"
  register: vm
  until: >
    (vm.resources | length) > 0 and
    (vm.resources[0].status is defined) and
    (vm.resources[0].status.printableStatus | default('')) in ["Running", "Paused", "Provisioning"]
  retries: "{{ vm_wait_retries | int }}"
  delay: "{{ vm_wait_delay | int }}"

# 6) OUTPUT

- name: Output | Summary
  ansible.builtin.debug:
    msg:
      - "Namespace: {{ namespace }}"
      - "VM: {{ vm_name }}"
      - "CPU/Memory: {{ cpu_cores | int }} cores / {{ memory }}"
      - "Disk: {{ disk_size }} (SC='{{ storage_class | default('default', true) }}', mode='{{ volume_mode | default('unspecified', true) }}')"
      - "Image: {{ image_url }}"
      - "RunStrategy: {{ run_strategy }}"